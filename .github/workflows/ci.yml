name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root:
          - terraform/modules/messaging
          - terraform/environments/local
          - terraform/environments/dev
          - terraform/environments/staging
          - terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - name: Format
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: Init (no backend, no AWS credentials)
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.root }}
      - name: Validate
        run: terraform validate
        working-directory: ${{ matrix.root }}

  # Plans every module (and whole environments) against a MOCKED AWS provider and asserts the security
  # and resilience guarantees. No AWS credentials exist in this workflow; nothing can be created.
  terraform-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [network, platform, data, service, frontend, github-oidc, stack]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - run: terraform init -backend=false -input=false
        working-directory: terraform/modules/${{ matrix.module }}
      - run: terraform test
        working-directory: terraform/modules/${{ matrix.module }}

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint this repository's workflows (actionlint + shellcheck)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -no-color

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile apps config --quiet
