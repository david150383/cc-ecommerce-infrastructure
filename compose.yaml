# Local development environment for the whole platform.
#
#   docker compose up -d                          # infrastructure only (DBs, Floci, Mailpit)
#   docker compose --profile apps up -d --build   # infrastructure + all services + frontend
#
# Each application is built from its own sibling repository. Override a build
# context with e.g. AUTH_SERVICE_PATH=/path/to/ecommerce-auth-service.
# Credentials here are LOCAL-ONLY development values. Never reuse them anywhere else.

name: ecommerce

x-service-defaults: &service-defaults
  profiles: ["apps"]
  restart: unless-stopped
  environment: &common-env
    NODE_ENV: development
    LOG_LEVEL: info
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://floci:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    MESSAGING_ENV_PREFIX: local-ecommerce
    JWT_ISSUER: ecommerce-auth-service
    JWT_AUDIENCE: ecommerce-api
    JWKS_URL: http://auth-service:4001/.well-known/jwks.json
    CORS_ALLOWED_ORIGINS: http://localhost:5173

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_admin
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./local/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongo_local_admin
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./local/mongo/init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      # mongosh is a Node.js program and can take several seconds to start on a busy machine.
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 10

  # Local AWS emulator (SNS, SQS, IAM, CloudWatch) — https://floci.io (MIT, no account needed).
  floci:
    image: floci/floci:2.0.1
    restart: unless-stopped
    ports: ["${FLOCI_PORT:-4566}:4566"]
    environment:
      # hybrid = in-memory speed + periodic flush to disk, so topics/queues survive restarts
      # (The LocalStack free image used in Phase 1–2 lost them on every Docker restart.)
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      # Queue URLs returned to other containers must use the service name, not localhost.
      FLOCI_HOSTNAME: floci
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    volumes:
      - ./.floci-data:/app/data
      # Deliberately NO /var/run/docker.sock mount: it is only needed for container-backed
      # services (Lambda, RDS, ECS, ...), and it gives the container root-equivalent host access.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_floci/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-off job: applies the SNS/SQS topology (the same Terraform as AWS) to Floci, then exits.
  # Idempotent: when nothing changed it is a no-op. Services that publish/consume wait for it.
  messaging-init:
    image: hashicorp/terraform:1.16.2
    working_dir: /workspace/environments/local
    # Separate data dir so the container never overwrites your machine's .terraform directory.
    environment:
      TF_DATA_DIR: /tmp/terraform-data
      TF_IN_AUTOMATION: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - terraform init -input=false -no-color >/dev/null && terraform apply -auto-approve -input=false -no-color -var aws_endpoint=http://floci:4566
    volumes:
      - ./terraform:/workspace
    depends_on:
      floci: { condition: service_healthy }
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off migration job: applies pending Prisma migrations, then exits.
  auth-migrate:
    profiles: ["apps"]
    build:
      context: ${AUTH_SERVICE_PATH:-../ecommerce-auth-service}
      target: migrate
    environment:
      DATABASE_URL: postgresql://auth_svc:auth_local_pw@postgres:5432/auth_db
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  auth-service:
    <<: *service-defaults
    build:
      context: ${AUTH_SERVICE_PATH:-../ecommerce-auth-service}
      target: runtime
    ports: ["4001:4001"]
    environment:
      <<: *common-env
      PORT: 4001
      DATABASE_URL: postgresql://auth_svc:auth_local_pw@postgres:5432/auth_db
      # Local only: a signing key is generated on first start and kept in the volume.
      JWT_KEYS_DIR: /app/keys
      FRONTEND_BASE_URL: http://localhost:5173
      # Secret-bearing emails (verification, password reset) go through the Notification Service's
      # internal endpoint; set smtp-dev to bypass it (straight to Mailpit) when working on Auth alone.
      NOTIFICATION_DELIVERY: ${AUTH_NOTIFICATION_DELIVERY:-http}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_SERVICE_URL: http://notification-service:4006
      # Browsers treat http://localhost as a secure context, so Secure cookies work locally.
      COOKIE_SECURE: "true"
      # Service-to-service clients (client-credentials grant). LOCAL-ONLY secrets; only their
      # SHA-256 hashes are configured here. Production: AWS Secrets Manager.
      SERVICE_CLIENTS: '[{"clientId":"ecommerce-order-service","secretSha256":"1e5e4c7bc5478dd65aaa11671be35d4f700340612b7cb577cd8aef63ff43b3c0","audiences":["ecommerce-product-service"]},{"clientId":"ecommerce-saga-orchestrator","secretSha256":"bb8445e11589db12892bbde8e14a9ff37cb1738f05a9d674843de216453153d7","audiences":["ecommerce-order-service","ecommerce-inventory-service","ecommerce-payment-service"]},{"clientId":"ecommerce-payment-service","secretSha256":"ce394ae238680387bfee85a518cac6cd356fef147d821f49a7da6765da510ea0","audiences":["ecommerce-order-service"]}]'
      MESSAGING_ENABLED: "true"
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:local-ecommerce-auth-events
    volumes:
      - auth-keys:/app/keys
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      messaging-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }

  # One-off migration job: applies pending Alembic migrations, then exits.
  product-migrate:
    profiles: ["apps"]
    build:
      context: ${PRODUCT_SERVICE_PATH:-../ecommerce-product-service}
      target: migrate
    environment:
      DATABASE_URL: postgresql+psycopg://product_svc:product_local_pw@postgres:5432/product_db
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  product-service:
    <<: *service-defaults
    build:
      context: ${PRODUCT_SERVICE_PATH:-../ecommerce-product-service}
      target: runtime
    ports: ["4002:4002"]
    environment:
      <<: *common-env
      PORT: 4002
      DATABASE_URL: postgresql+psycopg://product_svc:product_local_pw@postgres:5432/product_db
    depends_on:
      product-migrate: { condition: service_completed_successfully }
      auth-service: { condition: service_started }

  # One-off migration job: applies pending TypeORM migrations, then exits.
  inventory-migrate:
    profiles: ["apps"]
    build:
      context: ${INVENTORY_SERVICE_PATH:-../ecommerce-inventory-service}
      target: migrate
    environment:
      DATABASE_URL: postgresql://inventory_svc:inventory_local_pw@postgres:5432/inventory_db
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  inventory-service:
    <<: *service-defaults
    build:
      context: ${INVENTORY_SERVICE_PATH:-../ecommerce-inventory-service}
      target: runtime
    ports: ["4003:4003"]
    environment:
      <<: *common-env
      PORT: 4003
      DATABASE_URL: postgresql://inventory_svc:inventory_local_pw@postgres:5432/inventory_db
      MESSAGING_ENABLED: "true"
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:local-ecommerce-inventory-events
      COMMANDS_QUEUE_NAME: local-ecommerce-inventory-commands
    depends_on:
      inventory-migrate: { condition: service_completed_successfully }
      messaging-init: { condition: service_completed_successfully }
      auth-service: { condition: service_started }

  # One-off "migration" job: syncs the MongoDB indexes declared in the model, then exits.
  order-migrate:
    profiles: ["apps"]
    build:
      context: ${ORDER_SERVICE_PATH:-../ecommerce-order-service}
      target: migrate
    environment:
      MONGODB_URI: mongodb://order_svc:order_local_pw@mongo:27017/order_db?authSource=order_db
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"

  order-service:
    <<: *service-defaults
    build:
      context: ${ORDER_SERVICE_PATH:-../ecommerce-order-service}
      target: runtime
    ports: ["4004:4004"]
    environment:
      <<: *common-env
      PORT: 4004
      MONGODB_URI: mongodb://order_svc:order_local_pw@mongo:27017/order_db?authSource=order_db
      AUTH_SERVICE_URL: http://auth-service:4001
      SERVICE_CLIENT_ID: ecommerce-order-service
      SERVICE_CLIENT_SECRET: order-service-local-secret   # LOCAL ONLY
      PRODUCT_SERVICE_URL: http://product-service:4002
      COUPONS: '[{"code":"WELCOME10","percentBps":1000,"maxDiscountMinor":50000}]'
      MESSAGING_ENABLED: "true"
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:local-ecommerce-order-events
      COMMANDS_QUEUE_NAME: local-ecommerce-order-commands.fifo
    depends_on:
      order-migrate: { condition: service_completed_successfully }
      messaging-init: { condition: service_completed_successfully }
      auth-service: { condition: service_started }
      product-service: { condition: service_started }

  payment-migrate:
    profiles: ["apps"]
    build:
      context: ${PAYMENT_SERVICE_PATH:-../ecommerce-payment-service}
      target: migrate
    environment:
      DATABASE_URL: postgresql://payment_svc:payment_local_pw@postgres:5432/payment_db
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  payment-service:
    <<: *service-defaults
    build:
      context: ${PAYMENT_SERVICE_PATH:-../ecommerce-payment-service}
      target: runtime
    ports: ["4005:4005"]
    environment:
      <<: *common-env
      PORT: 4005
      DATABASE_URL: postgresql://payment_svc:payment_local_pw@postgres:5432/payment_db
      AUTH_SERVICE_URL: http://auth-service:4001
      SERVICE_CLIENT_ID: ecommerce-payment-service
      SERVICE_CLIENT_SECRET: payment-service-local-secret   # LOCAL ONLY
      ORDER_SERVICE_URL: http://order-service:4004
      # mock: hosted test checkout page at PUBLIC_BASE_URL (what the browser reaches), signed webhooks.
      # Stripe test mode: set PAYMENT_PROVIDER=stripe and the two keys in a git-ignored .env next to this file.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PUBLIC_BASE_URL: http://localhost:4005
      MOCK_WEBHOOK_SECRET: local-mock-webhook-secret   # LOCAL ONLY
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CHECKOUT_EXPIRY_MINUTES: ${PAYMENT_CHECKOUT_EXPIRY_MINUTES:-30}
      MESSAGING_ENABLED: "true"
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:local-ecommerce-payment-events
      COMMANDS_QUEUE_NAME: local-ecommerce-payment-commands
      RECONCILE_INTERVAL_MS: ${PAYMENT_RECONCILE_INTERVAL_MS:-60000}
    depends_on:
      payment-migrate: { condition: service_completed_successfully }
      messaging-init: { condition: service_completed_successfully }
      auth-service: { condition: service_started }
      order-service: { condition: service_started }

  notification-migrate:
    profiles: ["apps"]
    build:
      context: ${NOTIFICATION_SERVICE_PATH:-../ecommerce-notification-service}
      target: migrate
    environment:
      DATABASE_URL: postgresql://notification_svc:notification_local_pw@postgres:5432/notification_db
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  notification-service:
    <<: *service-defaults
    build:
      context: ${NOTIFICATION_SERVICE_PATH:-../ecommerce-notification-service}
      target: runtime
    ports: ["4006:4006"]
    environment:
      <<: *common-env
      PORT: 4006
      DATABASE_URL: postgresql://notification_svc:notification_local_pw@postgres:5432/notification_db
      JWT_SERVICE_AUDIENCE: ecommerce-notification-service
      TRANSACTIONAL_CALLERS: ecommerce-auth-service
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: "Shop <no-reply@shop.local>"
      SMS_PROVIDER: console
      ADMIN_ALERT_EMAILS: ops@shop.local
      SHOP_BASE_URL: http://localhost:5173
      MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-6}
      RETRY_BASE_MS: ${NOTIFICATION_RETRY_BASE_MS:-30000}
      MESSAGING_ENABLED: "true"
      COMMANDS_QUEUE_NAME: local-ecommerce-notification-commands
      INBOX_QUEUE_NAME: local-ecommerce-notification-inbox
      DLQ_NAMES: local-ecommerce-notification-commands-dlq,local-ecommerce-notification-inbox-dlq
    depends_on:
      notification-migrate: { condition: service_completed_successfully }
      messaging-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }

  # One-off migration job: applies the saga's SQL migrations (node-pg-migrate), then exits.
  saga-migrate:
    profiles: ["apps"]
    build:
      context: ${SAGA_ORCHESTRATOR_PATH:-../ecommerce-saga-orchestrator}
      target: migrate
    environment:
      DATABASE_URL: postgresql://saga_svc:saga_local_pw@postgres:5432/saga_db
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  saga-orchestrator:
    <<: *service-defaults
    build:
      context: ${SAGA_ORCHESTRATOR_PATH:-../ecommerce-saga-orchestrator}
      target: runtime
    ports: ["4007:4007"]
    environment:
      <<: *common-env
      PORT: 4007
      DATABASE_URL: postgresql://saga_svc:saga_local_pw@postgres:5432/saga_db
      AUTH_SERVICE_URL: http://auth-service:4001
      SERVICE_CLIENT_ID: ecommerce-saga-orchestrator
      SERVICE_CLIENT_SECRET: saga-orchestrator-local-secret   # LOCAL ONLY
      ORDER_SERVICE_URL: http://order-service:4004
      PAYMENT_SERVICE_URL: http://payment-service:4005
      MESSAGING_ENABLED: "true"
      SAGA_INBOX_QUEUE_NAME: local-ecommerce-saga-inbox
      INVENTORY_COMMANDS_QUEUE_NAME: local-ecommerce-inventory-commands
      ORDER_COMMANDS_QUEUE_NAME: local-ecommerce-order-commands.fifo
      PAYMENT_COMMANDS_QUEUE_NAME: local-ecommerce-payment-commands
      NOTIFICATION_COMMANDS_QUEUE_NAME: local-ecommerce-notification-commands
      SAGA_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:local-ecommerce-saga-events
      PAYMENT_TIMEOUT_SECONDS: ${SAGA_PAYMENT_TIMEOUT_SECONDS:-1800}
    depends_on:
      saga-migrate: { condition: service_completed_successfully }
      messaging-init: { condition: service_completed_successfully }
      auth-service: { condition: service_started }
      order-service: { condition: service_started }
      payment-service: { condition: service_started }

  frontend:
    profiles: ["apps"]
    restart: unless-stopped
    build:
      context: ${FRONTEND_PATH:-../ecommerce-frontend}
      args:
        VITE_AUTH_API_URL: http://localhost:4001
        VITE_PRODUCT_API_URL: http://localhost:4002
        VITE_INVENTORY_API_URL: http://localhost:4003
        VITE_ORDER_API_URL: http://localhost:4004
        VITE_PAYMENT_API_URL: http://localhost:4005
        VITE_NOTIFICATION_API_URL: http://localhost:4006
        VITE_SAGA_API_URL: http://localhost:4007
    ports: ["5173:8080"]

volumes:
  auth-keys:
  postgres-data:
  mongo-data:
